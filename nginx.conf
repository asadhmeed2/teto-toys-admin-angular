server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # No dotfiles (.git, .env, ...) even if one slips into the image.
    location ~ /\. { deny all; }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # 'unsafe-inline' styles: Angular injects component <style> tags at runtime.
    # ponytail: connect-src pins the one API in use; update it with the API base URL.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8081; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
