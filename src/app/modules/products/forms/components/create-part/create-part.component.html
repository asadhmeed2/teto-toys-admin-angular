<div class="min-h-screen bg-[var(--bg-primary)] flex items-start justify-center py-12 px-4">
  <div class="w-full max-w-xl bg-[var(--bg-secondary)] border border-[var(--border-glass)] rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.4)] overflow-hidden">

    <!-- Header -->
    <header class="flex items-center gap-4 px-8 py-6 border-b border-[var(--border-glass)]">
      <button (click)="goBack()" aria-label="Go back"
        class="flex items-center justify-center w-9 h-9 shrink-0 rounded-lg border border-[var(--border-glass)] bg-transparent text-[var(--text-secondary)] cursor-pointer hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)] transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      </button>
      <div>
        <h1 class="text-xl font-bold m-0 text-[var(--text-primary)] [font-family:var(--font-display)]">Create Part</h1>
        <p class="text-sm m-0 mt-0.5 text-[var(--text-secondary)]">Add a new part to be used in products</p>
      </div>
    </header>

    <div class="px-8 py-6 flex flex-col gap-5">

      @if (successMessage()) {
        <div class="flex items-center gap-2 px-4 py-3 rounded-lg text-sm text-[var(--brand-green)]"
             style="background: rgba(8,184,128,0.1); border: 1px solid rgba(8,184,128,0.3);">
          {{ successMessage() }}
        </div>
      }
      @if (errorMessage()) {
        <div class="flex items-center gap-2 px-4 py-3 rounded-lg text-sm text-[var(--brand-red)]"
             style="background: rgba(255,51,77,0.1); border: 1px solid rgba(255,51,77,0.3);">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="form" (submit)="onSubmit()" class="flex flex-col gap-5">

        <div class="flex flex-col gap-1.5">
          <label for="title" class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Part Title</label>
          <input id="title" type="text" formControlName="title" placeholder="e.g. Wooden Block A"
            class="w-full px-3.5 py-2.5 rounded-lg text-sm bg-[var(--bg-tertiary)] border border-[var(--border-glass)] text-[var(--text-primary)] placeholder-[var(--text-muted)] outline-none transition-all focus:border-[var(--brand-green)]" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="description" class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Description</label>
          <textarea id="description" formControlName="description" rows="3"
            placeholder="Detailed description of the part..."
            class="w-full px-3.5 py-2.5 rounded-lg text-sm bg-[var(--bg-tertiary)] border border-[var(--border-glass)] text-[var(--text-primary)] placeholder-[var(--text-muted)] outline-none transition-all focus:border-[var(--brand-green)] resize-y"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="price" class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Price ($)</label>
          <input id="price" type="number" step="0.01" formControlName="price" placeholder="0.00"
            class="w-full px-3.5 py-2.5 rounded-lg text-sm bg-[var(--bg-tertiary)] border border-[var(--border-glass)] text-[var(--text-primary)] placeholder-[var(--text-muted)] outline-none transition-all focus:border-[var(--brand-green)]" />
        </div>

        <!-- Image URLs -->
        <div class="flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold uppercase tracking-wider text-[var(--text-secondary)]">Image URLs</label>
            <button type="button" (click)="addImageUrlInput()"
              class="flex items-center gap-1 text-xs font-semibold px-3 py-1.5 rounded-lg border-0 cursor-pointer transition-all text-[var(--brand-green)] hover:opacity-80"
              style="background: rgba(8,184,128,0.1);">
              + Add URL
            </button>
          </div>
          <div formArrayName="imageUrls" class="flex flex-col gap-2">
            @for (urlControl of imageUrlsArray.controls; track $index) {
              <div class="flex items-center gap-2">
                <input [formControlName]="$index" type="text" placeholder="https://example.com/image.jpg"
                  class="flex-1 px-3.5 py-2.5 rounded-lg text-sm bg-[var(--bg-tertiary)] border border-[var(--border-glass)] text-[var(--text-primary)] placeholder-[var(--text-muted)] outline-none transition-all focus:border-[var(--brand-green)]" />
                <button type="button" (click)="removeImageUrlInput($index)" aria-label="Remove URL"
                  class="flex items-center justify-center w-9 h-9 shrink-0 rounded-lg border border-[var(--border-glass)] bg-transparent cursor-pointer text-[var(--text-secondary)] hover:bg-[rgba(255,51,77,0.1)] hover:text-[var(--brand-red)] hover:border-[rgba(255,51,77,0.3)] transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
            }
          </div>
        </div>

        <button type="submit" [disabled]="isLoading() || form.invalid"
          class="w-full flex items-center justify-center gap-2 py-3 px-6 rounded-lg text-sm font-semibold text-white border-0 cursor-pointer transition-all disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-[0_4px_14px_rgba(8,184,128,0.25)]"
          style="background: var(--accent-gradient);">
          @if (isLoading()) {
            <span class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
          } @else {
            Create Part
          }
        </button>

      </form>
    </div>
  </div>
</div>
