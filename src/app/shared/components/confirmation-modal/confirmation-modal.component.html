@if (open()) {
  <div class="fixed inset-0 z-[1000] flex items-center justify-center p-5 bg-[rgba(15,23,42,0.75)] backdrop-blur-[8px] animate-[fadeIn_0.2s_ease]"
       (click)="onCancel()">
    <div class="w-full max-w-[420px] flex flex-col bg-[var(--bg-secondary)] border border-[var(--border-glass)] rounded-[20px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] animate-[scaleUp_0.2s_cubic-bezier(0.34,1.56,0.64,1)]"
         (click)="$event.stopPropagation()">

      <!-- Header -->
      <header class="flex items-center justify-between px-6 py-5 border-b border-[var(--border-glass)]">
        <h3 class="m-0 text-xl font-semibold text-[var(--text-primary)] [font-family:var(--font-display)]">{{ title() }}</h3>
        <button (click)="onCancel()" aria-label="Close"
          class="flex items-center justify-center w-8 h-8 rounded-lg bg-transparent border-0 cursor-pointer text-2xl leading-none text-[var(--text-secondary)] hover:text-[var(--brand-red)] transition-colors">
          &times;
        </button>
      </header>

      <!-- Body -->
      @if (message()) {
        <div class="px-6 py-5">
          <p class="m-0 text-sm leading-relaxed text-[var(--text-secondary)]">{{ message() }}</p>
        </div>
      }

      <!-- Footer -->
      <footer class="flex items-center justify-end gap-3 px-6 pb-6 pt-2">
        <button (click)="onCancel()"
          class="px-5 py-2.5 rounded-lg text-sm font-medium cursor-pointer border border-[var(--border-glass)] bg-transparent text-[var(--text-secondary)] hover:text-[var(--text-primary)] hover:bg-[rgba(255,255,255,0.05)] transition-all">
          {{ cancelText() }}
        </button>
        <button (click)="onConfirm()" [class.bg-[var(--brand-red)]]="danger()"
          class="px-5 py-2.5 rounded-lg text-sm font-medium cursor-pointer border-0 text-white transition-all"
          [style]="danger() ? 'background: var(--brand-red);' : 'background: var(--accent-gradient);'">
          {{ confirmText() }}
        </button>
      </footer>
    </div>
  </div>
}
