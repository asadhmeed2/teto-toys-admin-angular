<div class="flex flex-col min-h-screen bg-[var(--bg-primary)]">

  <!-- Topbar -->
  <header class="sticky top-0 z-50 flex items-center justify-between px-6 md:px-10 py-4 bg-[var(--bg-glass)] backdrop-blur-md border-b border-[var(--border-glass)]">
    <div class="flex items-center gap-2.5">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor" class="w-6 h-6 text-[var(--brand-green)]">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
      <span class="text-lg font-bold text-[var(--text-primary)] [font-family:var(--font-display)]">TatoToys Admin</span>
    </div>

    <div class="flex items-center gap-3">

      <!-- Create New dropdown -->
      <div class="relative">
        <button (click)="toggleMenu()" aria-label="Toggle creation menu"
          class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold border-0 cursor-pointer transition-all text-white hover:shadow-[0_4px_12px_rgba(8,184,128,0.3)]"
          style="background: var(--accent-gradient);">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Create New</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
               class="w-3.5 h-3.5 transition-transform duration-200"
               [class.rotate-180]="isMenuOpen()">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        @if (isMenuOpen()) {
          <div class="absolute top-[calc(100%+8px)] right-0 min-w-[190px] bg-[var(--bg-primary)] border border-[var(--border-glass)] rounded-[14px] shadow-[0_8px_32px_rgba(0,0,0,0.3)] z-50 overflow-hidden">
            @if (permissionsService.permissions()?.userCreation) {
              <button (click)="navigateToCreateUser(); toggleMenu()"
                class="flex items-center gap-2.5 w-full px-4 py-3 text-left text-sm font-medium bg-transparent border-0 cursor-pointer text-[var(--text-primary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--brand-green)] transition-colors [font-family:var(--font-family)]">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 019.374 21c-2.331 0-4.512-.645-6.374-1.766z" />
                </svg>
                <span>Create User</span>
              </button>
            }
            <button (click)="navigateToCreateProduct(); toggleMenu()"
              class="flex items-center gap-2.5 w-full px-4 py-3 text-left text-sm font-medium bg-transparent border-0 cursor-pointer text-[var(--text-primary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--brand-green)] transition-colors [font-family:var(--font-family)]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Create Product</span>
            </button>
            <button (click)="navigateToCreatePart(); toggleMenu()"
              class="flex items-center gap-2.5 w-full px-4 py-3 text-left text-sm font-medium bg-transparent border-0 cursor-pointer text-[var(--text-primary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--brand-green)] transition-colors [font-family:var(--font-family)]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Create Part</span>
            </button>
            <button (click)="navigateToCreateCategory(); toggleMenu()"
              class="flex items-center gap-2.5 w-full px-4 py-3 text-left text-sm font-medium bg-transparent border-0 cursor-pointer text-[var(--text-primary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--brand-green)] transition-colors [font-family:var(--font-family)]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Create Category</span>
            </button>
            <button (click)="navigateToCreateSubcategory(); toggleMenu()"
              class="flex items-center gap-2.5 w-full px-4 py-3 text-left text-sm font-medium bg-transparent border-0 cursor-pointer text-[var(--text-primary)] hover:bg-[var(--bg-secondary)] hover:text-[var(--brand-green)] transition-colors [font-family:var(--font-family)]">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>Create Subcategory</span>
            </button>
          </div>
        }
      </div>

      <!-- Sign out -->
      <button (click)="logout()" [disabled]="isLoggingOut()"
        class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold border border-[var(--border-glass)] bg-transparent cursor-pointer text-[var(--text-secondary)] hover:bg-[rgba(255,51,77,0.1)] hover:text-[var(--brand-red)] hover:border-[rgba(255,51,77,0.3)] transition-all disabled:opacity-50">
        @if (isLoggingOut()) {
          <span class="w-4 h-4 rounded-full border-2 border-current/30 border-t-current animate-spin"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
          </svg>
          Sign Out
        }
      </button>

    </div>
  </header>

  <!-- Page content projected by the consuming route -->
  <ng-content />

</div>
